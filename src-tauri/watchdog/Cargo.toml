[package]
name = "clash-verge-buty-watchdog"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1.0"
tauri-winres = "0.1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
